<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App-Gesell: Evaluación CBCA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Evaluación CBCA - UFI ANIVI</h1>
        <p>Sistema de Asistencia Pericial - San Juan</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Información del Caso</h2>
            <div class="grid-form">
                <div class="input-group">
                    <label for="nombre-nino">Nombre del Menor</label>
                    <input type="text" id="nombre-nino" placeholder="Nombre completo">
                </div>
                <div class="input-group">
                    <label for="input-edad">Edad Actual</label>
                    <input type="number" id="input-edad" placeholder="Años">
                </div>
                <div class="input-group">
                    <label for="id-caso">Expediente / ID</label>
                    <input type="text" id="id-caso" placeholder="Ej: P-123/24">
                </div>
                <div class="input-group">
                    <label for="evaluador">Perito a cargo</label>
                    <input type="text" id="evaluador">
                </div>
            </div>
           <div id="panel-teoria" class="hidden"></div>
        </section>

        <section class="card">
            <h2>Relato de Cámara Gesell</h2>
            <div class="mic-container">
                <button id="btn-mic" class="btn-secundario">🎤 Iniciar Dictado</button>
                <span id="mic-status" class="texto-pequeno">Micrófono inactivo</span>
            </div>
            <div class="input-group">
                <label for="output-texto">Transcripción del Testimonio</label>
                <textarea id="output-texto" rows="10" placeholder="Escriba o dicte el relato aquí..."></textarea>
            </div>
            <button id="btn-analizar" class="btn-principal">Analizar Criterios de Credibilidad</button>
        </section>

        <section id="contenedor-sugerencias"></section>

        <section class="card">
            <div class="flex-header">
                <h2>Informe Pericial Final</h2>
                <button id="btn-generar" class="btn-secundario">Generar Texto</button>
            </div>
            <div class="input-group">
                <label for="conclusion-textarea">Resultado para descargar</label>
                <textarea id="conclusion-textarea" rows="12"></textarea>
            </div>
            <div class="grid-form-footer">
                <button type="button" class="btn-guardar">Guardar en Base</button>
                <button type="button" class="btn-descargar" onclick="window.print()">Imprimir / PDF</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
