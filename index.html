<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación CBCA - UFI ANIVI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Evaluación CBCA - UFI ANIVI</h1>
        <p>Sistema de Asistencia Pericial - San Juan</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Información del Caso</h2>
            <div class="grid-form">
                <div class="input-group">
                    <label for="input-nombre">Nombre del Menor</label>
                    <input type="text" id="input-nombre" placeholder="Nombre completo">
                </div>
                <div class="input-group">
                    <label for="input-edad">Edad Actual</label>
                    <input type="number" id="input-edad" placeholder="Años">
                </div>
            </div>
            <div id="panel-teoria" class="hidden"></div>
        </section>

        <section class="card">
            <h2>Relato de Cámara Gesell</h2>
            <div class="controles-mic">
                <button id="btn-mic" class="btn-principal">🎤 Iniciar Transcripción</button>
                <span id="mic-status">Micrófono inactivo</span>
            </div>
            <label for="output-texto">Transcripción del Testimonio:</label>
            <textarea id="output-texto" rows="10" placeholder="El texto aparecerá aquí mientras el parlante suena..."></textarea>
            <button id="btn-analizar" class="btn-secundario">Analizar Criterios de Credibilidad</button>
        </section>

        <section id="contenedor-sugerencias" class="card hidden"></section>

        <section class="card">
            <h2>Borrador de Informe Pericial</h2>
            <label for="conclusion-textarea">Resultado del análisis:</label>
            <textarea id="conclusion-textarea" rows="8" readonly placeholder="El informe se generará automáticamente..."></textarea>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
